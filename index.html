        "Squared (Negative)": { upper: "?뀺?뀻?뀼?뀽?뀾?뀿?끀?끁?끂?끃?끆?끇?끉?끋?끍?끏???냱?냲?냳?냴?냵?냶?냷?냸?냹", lower: "?뀺?뀻?뀼?뀽?뀾?뀿?끀?끁?끂?끃?끆?끇?끉?끋?끍?끏???냱?냲?냳?냴?냵?냶?냷?냸?냹", num: "0123456789" },
        "Monospace": { upper: "?솻?솼?솾?솿?쇀?쇁?쇂?쇃?쇅?쇆?쇇?쇉?쇊?쇋?쇍?쇎???쉧?쉨?쉩?쉪?쉫?쉮?쉯?쉱?쉲", lower: "?쉳?쉵?쉶?쉷?쉸?쉹?쉺?쉻?쉾?슀?슂?슃?슄?슅?슆?슇?슊?슋?슌?슍?슎?슑?슒?슓?슔", num: "?윾?윿?읁?읂?읃?읅?읆?읇?읈?읉" }
      };

      const normalUpper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const normalLower = "abcdefghijklmnopqrstuvwxyz";
      const normalNum   = "0123456789";

      function convertText(text, map) {
        let result = "";
        const upperArray = Array.from(map.upper);
        const lowerArray = Array.from(map.lower);
        const numArray   = Array.from(map.num);

        for (let char of text) {
          const idxUpper = normalUpper.indexOf(char);
          const idxLower = normalLower.indexOf(char);
          const idxNum   = normalNum.indexOf(char);

          if (idxUpper !== -1) result += upperArray[idxUpper] || char;
          else if (idxLower !== -1) result += lowerArray[idxLower] || char;
          else if (idxNum !== -1) result += numArray[idxNum] || char;
          else result += char;
        }
        return result;
      }

      const inputText = document.getElementById('inputText');
      const charCount = document.getElementById('charCount');
      const clearBtn = document.getElementById('clearBtn');
      const receiptSection = document.getElementById('receiptSection');
      const receiptItems = document.getElementById('receiptItems');
      const totalStyles = document.getElementById('totalStyles');
      const receiptDate = document.getElementById('receiptDate');
      const receiptTime = document.getElementById('receiptTime');
      const toast = document.getElementById('toast');

      function updateReceiptDateTime() {
        const now = new Date();
        receiptDate.innerText = `DATE: ${now.toISOString().slice(0,10).replace(/-/g, '.')}`;
        receiptTime.innerText = `TIME: ${now.toTimeString().slice(0,8)}`;
      }

      inputText.addEventListener('input', (e) => {
        const text = e.target.value;
        charCount.innerText = `${text.length} characters`;

        if (text.trim().length > 0) {
          updateReceiptDateTime();
          renderReceipt(text);
          receiptSection.classList.remove('hidden');
          setTimeout(() => {
            receiptSection.classList.remove('scale-95', 'opacity-0');
            receiptSection.classList.add('scale-100', 'opacity-100');
          }, 50);
        } else {
          receiptSection.classList.add('scale-95', 'opacity-0');
          receiptSection.classList.remove('scale-100', 'opacity-100');
          setTimeout(() => receiptSection.classList.add('hidden'), 200);
        }
      });

      clearBtn.addEventListener('click', () => {
        inputText.value = "";
        inputText.dispatchEvent(new Event('input'));
        inputText.focus();
      });

      function renderReceipt(text) {
        receiptItems.innerHTML = "";
        let styleCount = 0;

        for (const [fontName, map] of Object.entries(fontMaps)) {
          styleCount++;
          const converted = convertText(text, map);
          const itemDiv = document.createElement('div');
          itemDiv.className = "group relative border-b border-dotted border-zinc-200 pb-3 last:border-0 hover:bg-zinc-50 rounded p-1 transition-all duration-150 cursor-pointer";
          itemDiv.title = "?대┃?섏뿬 蹂듭궗";
          itemDiv.addEventListener('click', () => copyToClipboard(converted));
          itemDiv.innerHTML = `
            <div class="flex justify-between items-center text-[10px] text-zinc-400 mb-1">
              <span class="font-bold tracking-widest">${String(styleCount).padStart(2, '0')} // ${fontName.toUpperCase()}</span>
              <span class="text-indigo-600 font-semibold opacity-0 group-hover:opacity-100 transition-opacity">CLICK TO COPY</span>
            </div>
            <div class="text-[15px] text-zinc-900 font-medium break-all select-all tracking-wide pr-8">
              ${converted}
            </div>
            <div class="absolute right-2 bottom-3 text-zinc-300 group-hover:text-indigo-500 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
              </svg>
            </div>
          `;
          receiptItems.appendChild(itemDiv);
        }
        totalStyles.innerText = `${styleCount} ITEMS`;
      }

      function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
          toast.classList.remove('translate-y-10', 'opacity-0');
          toast.classList.add('translate-y-0', 'opacity-100');
          setTimeout(() => {
            toast.classList.remove('translate-y-0', 'opacity-100');
            toast.classList.add('translate-y-10', 'opacity-0');
          }, 2000);
        });
      }
    </script>
